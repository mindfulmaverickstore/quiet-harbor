# Builds our map packs on temporary GitHub computers and uploads them straight to Cloudflare R2.
# Run it from GitHub: Actions > "Build maps" > Run workflow.
#   places: "missing" (not yet published), "all" (rebuild everything), or ids separated by spaces
# Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET (Cloudflare) and, for Backblaze,
# B2_KEY_ID, B2_APP_KEY, B2_BUCKET, B2_ENDPOINT. Pick the destination with the "target" input.
# One place per job (a few minutes each), one after another in small groups; a final job rebuilds catalog.json.
# A standard GitHub computer has about 14 GB of free disk and 6 hours, which is plenty for one place at a time.
# It is NOT enough for the whole-planet file (about 68 GB); that needs a bigger machine.
name: Build maps

on:
  workflow_dispatch:
    inputs:
      places:
        description: 'missing, all, or place ids separated by spaces (see pipeline/maps/places.json)'
        required: true
        default: 'missing'
      target:
        description: 'Where to upload: r2 (Cloudflare) or b2 (Backblaze)'
        required: true
        default: 'r2'
      round:
        description: 'Which attempt this is (the workflow starts later rounds itself)'
        required: false
        default: '1'
      source:
        description: 'Planet build to cut from: latest, or a full address'
        required: true
        default: 'latest'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.list.outputs.ids }}
      any: ${{ steps.list.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          want="${{ github.event.inputs.places }}"
          if [ "$want" = "missing" ]; then want="$(python3 pipeline/maps/build_maps.py --missing)"; fi
          if [ "$want" = "all" ]; then want="$(python3 pipeline/maps/build_maps.py --all-ids)"; fi
          # Several places per job, so the few minutes of setting up are shared.
          ids="$(echo "$want" | tr -s ' ' '\n' | grep . | paste -d' ' - - - - - - | jq -R . | jq -sc .)"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$ids" = "[]" ] && echo no || echo yes)" >> "$GITHUB_OUTPUT"
          echo "Will build: $ids"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    name: map ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Get the pmtiles program
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64*' -D tool
          cd tool && (ls *.tar.gz >/dev/null 2>&1 && tar xzf *.tar.gz || unzip -o *.zip) && chmod +x pmtiles && ./pmtiles version
      - name: Cut the map and upload it
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event.inputs.target == 'b2' && secrets.B2_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.target == 'b2' && secrets.B2_APP_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ github.event.inputs.target == 'b2' && 'us-west-004' || 'auto' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ github.event.inputs.target == 'b2' && secrets.B2_ENDPOINT || format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ github.event.inputs.target == 'b2' && secrets.B2_BUCKET || secrets.R2_BUCKET }}
          MAPS_PUBLIC_URL: ${{ github.event.inputs.target == 'b2' && format('{0}/{1}', secrets.B2_ENDPOINT, secrets.B2_BUCKET) || '' }}
        run: |
          python3 pipeline/maps/build_maps.py --pmtiles ./tool/pmtiles --source '${{ github.event.inputs.source }}' --only ${{ matrix.id }} --no-catalog
          python3 pipeline/maps/build_maps.py --status | head -1

  catalog:
    needs: [plan, build]
    if: always() && needs.plan.outputs.any == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild and upload catalog.json
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event.inputs.target == 'b2' && secrets.B2_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.target == 'b2' && secrets.B2_APP_KEY || secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ github.event.inputs.target == 'b2' && 'us-west-004' || 'auto' }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ github.event.inputs.target == 'b2' && secrets.B2_ENDPOINT || format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ github.event.inputs.target == 'b2' && secrets.B2_BUCKET || secrets.R2_BUCKET }}
          MAPS_PUBLIC_URL: ${{ github.event.inputs.target == 'b2' && format('{0}/{1}', secrets.B2_ENDPOINT, secrets.B2_BUCKET) || '' }}
        run: python3 pipeline/maps/build_maps.py --catalog-only

  # Maps that still failed after their own retries get another go later, so one bad hour at the source isn't the end of it.
  # Three rounds, 30 minutes apart, then it stops and the failures stay on record.
  again:
    needs: [plan, build, catalog]
    if: always() && needs.plan.outputs.any == 'yes' && github.event.inputs.round < '3'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Start another round for what is missing
        env:
          GH_TOKEN: ${{ github.token }}
          S3_ENDPOINT: ${{ github.event.inputs.target == 'b2' && secrets.B2_ENDPOINT || format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ github.event.inputs.target == 'b2' && secrets.B2_BUCKET || secrets.R2_BUCKET }}
          MAPS_PUBLIC_URL: ${{ github.event.inputs.target == 'b2' && format('{0}/{1}', secrets.B2_ENDPOINT, secrets.B2_BUCKET) || '' }}
        run: |
          want='${{ github.event.inputs.places }}'
          missing="$(python3 pipeline/maps/build_maps.py --missing)"
          if [ "$want" = "missing" ] || [ "$want" = "all" ]; then todo="$missing"; else
            todo=""; for id in $want; do case " $missing " in *" $id "*) todo="$todo $id";; esac; done
          fi
          todo="$(echo $todo)"
          if [ -z "$todo" ]; then echo "Nothing missing."; exit 0; fi
          echo "Still missing: $todo"
          sleep 1800
          next=$(( ${{ github.event.inputs.round }} + 1 ))
          gh workflow run build-maps.yml -f places="$todo" -f target='${{ github.event.inputs.target }}' -f source='${{ github.event.inputs.source }}' -f round="$next"
