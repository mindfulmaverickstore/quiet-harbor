# Makes a "light" copy of each published map (no building outlines, less plain land shading at street zoom) and a
# density list for sizing areas. Both go next to the original, which is never changed: maps/<id>/light.pmtiles and
# maps/<id>/density.json. A last job writes maps/light.json with every size.
# Run it from GitHub: Actions > "Build light maps" > Run workflow.
#   places: "all" (every published map) or ids separated by spaces
name: Build light maps

on:
  workflow_dispatch:
    inputs:
      places:
        description: 'all, or place ids separated by spaces'
        required: true
        default: 'all'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          want="${{ github.event.inputs.places }}"
          if [ "$want" = "all" ]; then
            want="$(curl -s -A map-build/1.0 "https://pub-e5b664167e394466a0e48820dffb17df.r2.dev/maps/catalog.json" | jq -r '.maps[].id' | tr '\n' ' ')"
          fi
          # Ten maps per job keeps the list under GitHub's limit of 256 jobs.
          groups="$(echo "$want" | tr -s ' ' '\n' | grep . | paste -d' ' - - - - - - - - - - | jq -R . | jq -sc .)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  light:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    name: light ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - name: Get the pmtiles program (to check each new file)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64*' -D tool
          cd tool && (ls *.tar.gz >/dev/null 2>&1 && tar xzf *.tar.gz || unzip -o *.zip) && chmod +x pmtiles && echo "$PWD" >> "$GITHUB_PATH"
      - name: Make and upload the light maps
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 pipeline/maps/light_maps.py --ids ${{ matrix.group }}

  summary:
    needs: [plan, light]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Write maps/light.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 pipeline/maps/light_maps.py --summary
      - name: Then cut the world into download areas (only after a run over every map)
        if: github.event.inputs.places == 'all'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-areas.yml -f regions=part1
