# Makes the map's letters (Roboto with Noto Sans for other scripts) and uploads them to maps/shared/glyphs/VF */.
# Run it from GitHub: Actions > "Build fonts" > Run workflow.
name: Build fonts

on:
  workflow_dispatch:

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get the openmaptiles fonts (Roboto, Apache 2.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p fonts-src && gh release download v2.0 -R openmaptiles/fonts -p 'v2.0.zip' -D fonts-src
          cd fonts-src && unzip -q v2.0.zip && ls | grep -i roboto
      - name: Merge and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for f in "Noto Sans Regular" "Noto Sans Medium" "Noto Sans Italic"; do
            aws s3 sync "s3://$S3_BUCKET/maps/shared/glyphs/$f/" "noto/$f/" --endpoint-url "$S3_ENDPOINT" --only-show-errors
          done
          ls noto/*/ | head -3; ls "noto/Noto Sans Regular" | wc -l
          python3 pipeline/maps/make_fonts.py fonts-src noto fonts-out
          aws s3 cp fonts-out "s3://$S3_BUCKET/maps/shared/glyphs/" --recursive --endpoint-url "$S3_ENDPOINT" --content-type application/x-protobuf --only-show-errors
          echo uploaded
