# Removes ONLY areas/files/ from the Backblaze bucket (the partial copy of 8 Nov 2026). Touches nothing else, and never R2.
# Run it from GitHub: Actions > "Remove area files from Backblaze" > Run workflow.
name: Remove area files from Backblaze

on:
  workflow_dispatch:

jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_B2_TYPE: s3
      RCLONE_CONFIG_B2_PROVIDER: Other
      RCLONE_CONFIG_B2_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      RCLONE_CONFIG_B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      RCLONE_CONFIG_B2_REGION: us-west-004
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
    steps:
      - name: Get rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Remove areas/files/ and show what is left
        run: |
          {
            echo "### Backblaze clean-up"
            echo
            echo "Before: $(rclone size "b2:$B2_BUCKET/areas/files/" --json)"
            rclone delete "b2:$B2_BUCKET/areas/files/" --s3-no-check-bucket --checkers 32 --transfers 32 --rmdirs || true
            echo
            echo "After: $(rclone size "b2:$B2_BUCKET/areas/files/" --json)"
            echo
            echo "Whole bucket now: $(rclone size "b2:$B2_BUCKET" --json)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
