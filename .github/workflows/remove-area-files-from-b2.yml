# Removes one folder from the Backblaze bucket (default areas/files/; "everything" empties the bucket). Never touches R2.
# Run it from GitHub: Actions > "Remove area files from Backblaze" > Run workflow.
name: Remove area files from Backblaze

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder to remove, e.g. areas/files/ (or "everything")'
        required: true
        default: 'areas/files/'
      old_versions:
        description: 'Also remove hidden old versions (yes/no)'
        required: true
        default: 'yes'

jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_B2_TYPE: s3
      RCLONE_CONFIG_B2_PROVIDER: Other
      RCLONE_CONFIG_B2_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      RCLONE_CONFIG_B2_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
      RCLONE_CONFIG_B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      RCLONE_CONFIG_B2_REGION: us-west-004
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      FOLDER: ${{ github.event.inputs.folder }}
      OLD: ${{ github.event.inputs.old_versions }}
    steps:
      - name: Get rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Remove the folder and show what is left
        run: |
          {
            echo "### Backblaze clean-up"
            echo
            if [ "$FOLDER" = "everything" ]; then path=""; else path="${FOLDER#/}"; fi
            echo "Before: $(rclone size "b2:$B2_BUCKET/$path" --json)"
            rclone delete "b2:$B2_BUCKET/$path" --s3-no-check-bucket --checkers 32 --transfers 32 --rmdirs || true
            # Backblaze only hides deleted files (it keeps old versions); this removes those hidden copies for good.
            if [ "$OLD" = "yes" ]; then
              echo "Hidden old versions before: $(rclone size "b2:$B2_BUCKET/$path" --s3-versions --json)"
              rclone delete "b2:$B2_BUCKET/$path" --s3-versions --s3-no-check-bucket --checkers 32 --transfers 32 || true
              echo
              echo "Hidden old versions after: $(rclone size "b2:$B2_BUCKET/$path" --s3-versions --json)"
            fi
            echo
            echo "After: $(rclone size "b2:$B2_BUCKET/$path" --json)"
            echo
            echo "Whole bucket now: $(rclone size "b2:$B2_BUCKET" --json)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
