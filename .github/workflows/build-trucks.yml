# Builds the food truck layer (trucks/<lat>_<lon>.json) from Overture, Foursquare and city feeds. Runs every Monday (about 10 minutes,
# free on a public repository): Overture and Foursquare change monthly and the city lists weekly or less. It can also be run by hand.
# Secrets: HF_TOKEN (Hugging Face, read-only, with access to foursquare/fsq-os-places), MATCH_RULES, R2_* for our tiles.
name: Build food truck layer

on:
  schedule:
    - cron: '40 9 * * 1'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release date folder on Hugging Face'
        required: true
        default: '2026-10-15'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install duckdb
      - name: Build and upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MATCH_RULES: ${{ secrets.MATCH_RULES }}
          FSQ_RELEASE: ${{ github.event.inputs.release || '2026-10-15' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 pipeline/maps/build_trucks.py
