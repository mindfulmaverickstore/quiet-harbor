# Makes the small per-region area lists the app reads (areas/lists/<region>.json) from the outlines and file sizes already made.
# Run it from GitHub: Actions > "Build area lists" > Run workflow. regions: "all" or region names separated by spaces.
name: Build area lists

on:
  workflow_dispatch:
    inputs:
      regions:
        description: 'all, or region names separated by spaces'
        required: true
        default: 'all'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - id: list
        run: |
          want="${{ github.event.inputs.regions }}"
          if [ "$want" = "all" ]; then
            want="$(curl -s -A map-build/1.0 --compressed "https://pub-e5b664167e394466a0e48820dffb17df.r2.dev/areas/index.json" | jq -r '.regions[].region' | tr '\n' ' ')"
          fi
          groups="$(echo "$want" | tr -s ' ' '\n' | grep . | paste -d' ' - - - - - - - - - - | jq -R . | jq -sc .)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  lists:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    name: lists ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install shapely
      - name: Make the lists
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 pipeline/maps/make_area_lists.py ${{ matrix.group }}
