# Lists the named food places of each published map (food.json and food-N.json next to its city.pmtiles), so the app can search them
# by name or kind from any zoom. Run it from GitHub: Actions > "Build food index" > Run workflow.
#   places: "all" (every published map) or ids separated by spaces
# Secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET.
name: Build food index

on:
  workflow_dispatch:
    inputs:
      places:
        description: 'all, or place ids separated by spaces'
        required: true
        default: 'all'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          want="${{ github.event.inputs.places }}"
          if [ "$want" = "all" ]; then
            want="$(curl -s -A map-build/1.0 "https://pub-e5b664167e394466a0e48820dffb17df.r2.dev/maps/catalog.json" | jq -r '.maps[].id' | tr '\n' ' ')"
          fi
          groups="$(echo "$want" | tr -s ' ' '\n' | grep . | paste -d' ' - - - - - - - - | jq -R . | jq -sc .)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  index:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    name: index ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pmtiles mapbox-vector-tile
      - name: Read the food places and upload them
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ format('https://{0}.r2.cloudflarestorage.com', secrets.R2_ACCOUNT_ID) }}
          S3_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python3 pipeline/maps/build_food_index.py --ids ${{ matrix.group }}
