# Sends a few small requests to every database listed in the repository secrets, several times a day, so the free plan doesn't
# pause them for being quiet. Each database has an address and a public key: DB_URL and DB_KEY (the first), DB_URL_2 and DB_KEY_2
# (the second). Run it by hand from Actions > "Keep database awake".
name: Keep database awake

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask each database for one row
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_KEY: ${{ secrets.DB_KEY }}
          DB_URL_2: ${{ secrets.DB_URL_2 }}
          DB_KEY_2: ${{ secrets.DB_KEY_2 }}
        run: |
          # A "permission denied" answer still means the database woke up and replied; only no answer is a failure.
          fail=0
          ping() {
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 30 -H "apikey: $2" "$1/rest/v1/reports?select=id&limit=1")
              echo "$3 answered: $code"
              if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then fail=1; fi
              sleep 5
            done
          }
          # Say which project each one is (by the first letters of its address), so a log shows what was kept awake.
          name() { case "$1" in *gpzy*) echo "real database" ;; *ffku*) echo "test database" ;; *) echo "database $2" ;; esac; }
          if [ -n "$DB_URL" ]; then ping "$DB_URL" "$DB_KEY" "$(name "$DB_URL" 1)"; fi
          if [ -n "$DB_URL_2" ]; then ping "$DB_URL_2" "$DB_KEY_2" "$(name "$DB_URL_2" 2)"; else echo "second database is not set up"; fi
          exit $fail
