# Sends a small request to the database twice a week, so the free plan doesn't pause it for being quiet.
# The address and public key are repository secrets (DB_URL, DB_KEY). Run it by hand from Actions > "Keep database awake".
name: Keep database awake

on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database for one row
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_KEY: ${{ secrets.DB_KEY }}
        run: |
          # A "permission denied" answer still means the database woke up and replied; only no answer is a failure.
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 -H "apikey: $DB_KEY" "$DB_URL/rest/v1/reports?select=id&limit=1")
          echo "database answered: $code"
          test "$code" != "000" && test "$code" -lt 500
